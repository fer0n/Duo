# SwiftLint Configuration

opt_in_rules:

# Exclude build and dependency folders
excluded:
  - build
  - .claude  # agent worktrees: linting another branch's copy would fail this build
  - Carthage
  - Pods
  - .build
  - DerivedData

# Type/Function/File Body Length
type_body_length:
  warning: 750
  error: 800

file_length:
  warning: 1050
  error: 1100

function_body_length:
  warning: 200
  error: 220

# Cyclomatic Complexity
cyclomatic_complexity:
  warning: 30
  error: 40

disabled_rules:
  - identifier_name

# Large Tuple
large_tuple:
  warning: 4
  error: 5
